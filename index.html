<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InnSide Laundry — Premium Laundry Bandung</title>
<link rel="icon" type="image/png" href="https://github.com/innsidelaundry-boop/innside-assets/blob/main/Logo%201200PX%20-%20White.png?raw=true">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================
   ROOT VARIABLES
============================ */
:root {
  --red: #d70000;
  --red-hover: #b50000;
  --red-dim: rgba(215,0,0,0.08);
  --red-glow: rgba(215,0,0,0.22);
  --white: #ffffff;
  --off-white: #fafafa;
  --gray-100: #f5f5f5;
  --gray-200: #ebebeb;
  --gray-300: #d4d4d4;
  --gray-400: #a3a3a3;
  --gray-500: #737373;
  --gray-600: #525252;
  --charcoal: #1a1a1a;
  --charcoal-2: #262626;
  --charcoal-3: #2e2e2e;
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'Outfit', system-ui, sans-serif;
  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 32px;
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --sh-sm: 0 1px 8px rgba(0,0,0,0.06);
  --sh-md: 0 4px 24px rgba(0,0,0,0.08);
  --sh-lg: 0 12px 48px rgba(0,0,0,0.12);
  --sh-xl: 0 24px 80px rgba(0,0,0,0.16);
}

/* ============================
   RESET & BASE
============================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: var(--sans);
  color: var(--charcoal);
  background: var(--white);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
img, video { display: block; max-width: 100%; }
a { text-decoration: none; color: inherit; }
button { font-family: var(--sans); cursor: pointer; }
ul { list-style: none; }

/* ============================
   LANGUAGE SYSTEM
============================ */
body.lang-id [data-en] { display: none !important; }
body.lang-en [data-id] { display: none !important; }

/* ============================
   SCROLLBAR
============================ */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 3px; }

/* ============================
   MEDIA EDITOR MODAL
============================ */
.med-modal {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
  align-items: center; justify-content: center; padding: 20px;
}
.med-modal.open { display: flex; }
.med-box {
  background: white; border-radius: var(--r-lg); padding: 32px;
  max-width: 480px; width: 100%; max-height: 88vh; overflow-y: auto;
  box-shadow: var(--sh-xl);
}
.med-box h3 {
  font-family: var(--serif); font-size: 20px; color: var(--charcoal);
  margin-bottom: 4px;
}
.med-box .med-desc { font-size: 13px; color: var(--gray-400); margin-bottom: 22px; }
.med-tabs { display: flex; gap: 6px; margin-bottom: 20px; }
.med-tab {
  border: 1.5px solid var(--gray-200); border-radius: 50px; background: none;
  padding: 7px 16px; font-size: 12.5px; font-weight: 600; color: var(--gray-500);
  transition: all 0.2s;
}
.med-tab.active { background: var(--charcoal); border-color: var(--charcoal); color: white; }
.med-field { margin-bottom: 14px; }
.med-field label {
  display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: var(--gray-400); margin-bottom: 7px;
}
.med-field input, .med-field select {
  width: 100%; border: 1.5px solid var(--gray-200); border-radius: var(--r-sm);
  padding: 10px 13px; font-family: var(--sans); font-size: 13.5px;
  color: var(--charcoal); outline: none; transition: border-color 0.2s;
  background: white;
}
.med-field input:focus, .med-field select:focus { border-color: var(--red); }
.med-actions { display: flex; gap: 8px; margin-top: 22px; }
.med-apply {
  flex: 1; background: var(--red); color: white; border: none;
  padding: 11px; border-radius: 50px; font-size: 14px; font-weight: 600;
  transition: background 0.2s;
}
.med-apply:hover { background: var(--red-hover); }
.med-cancel {
  background: var(--gray-100); color: var(--charcoal); border: none;
  padding: 11px 20px; border-radius: 50px; font-size: 14px; font-weight: 500;
  transition: background 0.2s;
}
.med-cancel:hover { background: var(--gray-200); }

/* ============================
   NAVIGATION
============================ */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 900;
  background: rgba(255,255,255,0.93);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
  transition: box-shadow 0.3s;
}
.nav.up { box-shadow: 0 2px 20px rgba(0,0,0,0.07); }
.nav-wrap {
  max-width: 1200px; margin: 0 auto; padding: 0 32px;
  height: 66px; display: flex; align-items: center; justify-content: space-between;
}
/* Logo */
.nav-logo { display: flex; align-items: center; gap: 10px; }
.nav-logo-icon {
  width: 36px; height: 36px; background: transparent; border-radius: 50%; overflow: hidden;
  display: grid; place-items: center;
}
.nav-logo-icon svg { width: 20px; height: 20px; }
.nav-logo-icon img {
  width: 30px; height: 30px; object-fit: contain;
  background: transparent;
  display: block;
  border-radius: 50%;
}
.nav-logo-text { font-family: var(--serif); font-size: 18px; font-weight: 600; color: var(--charcoal); }
.nav-logo-text em { color: var(--red); font-style: normal; }
/* Links */
.nav-links { display: flex; gap: 34px; }
.nav-links a {
  font-size: 13.5px; font-weight: 500; color: var(--gray-500);
  transition: color 0.2s; position: relative; padding-bottom: 2px;
}
.nav-links a::after {
  content: ''; position: absolute; bottom: -3px; left: 0;
  width: 0; height: 1.5px; background: var(--red); transition: width 0.25s var(--ease);
}
.nav-links a:hover { color: var(--charcoal); }
.nav-links a:hover::after { width: 100%; }
/* Right controls */
.nav-controls { display: flex; align-items: center; gap: 14px; }
.lang-toggle { display: flex; background: var(--gray-100); border-radius: 30px; padding: 3px; gap: 2px; }
.lang-btn {
  border: none; background: none; padding: 5px 14px; border-radius: 24px;
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.5px; color: var(--gray-400);
  transition: all 0.2s;
}
.lang-btn.on { background: white; color: var(--charcoal); box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
.nav-wa {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--red); color: white; border: none;
  padding: 9px 20px; border-radius: 50px;
  font-size: 13px; font-weight: 600;
  transition: all 0.25s var(--ease);
}
.nav-wa:hover { background: var(--red-hover); transform: translateY(-1px); box-shadow: 0 5px 16px var(--red-glow); }
/* Hamburger */
.hamburger { display: none; flex-direction: column; gap: 4.5px; cursor: pointer; padding: 5px; }
.hamburger span { display: block; width: 22px; height: 1.5px; background: var(--charcoal); border-radius: 2px; transition: all 0.3s; }
/* Mobile nav */
.mnav {
  display: none; position: fixed; top: 66px; left: 0; right: 0; z-index: 899;
  background: white; border-bottom: 1px solid var(--gray-200);
  padding: 14px 28px 22px; flex-direction: column; gap: 2px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.1);
}
.mnav.open { display: flex; }
.mnav a { display: block; padding: 12px 0; font-size: 16px; font-weight: 500; color: var(--charcoal); border-bottom: 1px solid var(--gray-100); transition: color 0.2s; }
.mnav a:hover { color: var(--red); }
.mnav-wa { background: var(--red); color: white; text-align: center; padding: 13px; border-radius: 50px; font-weight: 600; margin-top: 14px; display: block; }

/* ============================
   HERO
============================ */
.hero {
  min-height: 100vh; position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  padding-top: 66px;
}
/* Hero background layers */
.hero-bg { position: absolute; inset: 0; z-index: 0; }
.hero-bg-img {
  width: 100%; height: 100%; object-fit: cover;
  transition: opacity 0.8s ease; opacity: 1;
}
.hero-bg-vid {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: none;
}
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(
    108deg,
    rgba(10,10,10,0.88) 0%,
    rgba(10,10,10,0.72) 45%,
    rgba(10,10,10,0.38) 75%,
    rgba(10,10,10,0.22) 100%
  );
}
/* Hero decorative element - spinning ring */
.hero-deco {
  position: absolute; right: 7%; top: 50%; transform: translateY(-50%);
  width: 380px; height: 380px; z-index: 2; pointer-events: none;
}
.hero-ring {
  position: absolute; top: 50%; left: 50%;
  border-radius: 50%; border: 1px solid rgba(255,255,255,0.07);
  transform: translate(-50%, -50%);
}
.hero-ring-1 { width: 100px; height: 100px; border: 2px solid rgba(215,0,0,0.25); animation: hrspin 20s linear infinite; }
.hero-ring-2 { width: 180px; height: 180px; border-style: dashed; animation: hrspin 35s linear infinite reverse; }
.hero-ring-3 { width: 280px; height: 280px; animation: hrspin 55s linear infinite; }
.hero-ring-4 { width: 380px; height: 380px; border-color: rgba(255,255,255,0.04); }
.hero-ring-center {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(215,0,0,0.1); border: 1.5px solid rgba(215,0,0,0.3);
  display: grid; place-items: center;
  font-size: 26px; animation: hrspin 5s linear infinite;
}
@keyframes hrspin {
  from { transform: translate(-50%,-50%) rotate(0deg); }
  to { transform: translate(-50%,-50%) rotate(360deg); }
}
/* Hero content */
.hero-content {
  position: relative; z-index: 3;
  max-width: 1200px; margin: 0 auto; padding: 88px 32px 80px;
  width: 100%; flex: 1; display: flex; flex-direction: column; justify-content: center;
}
.hero-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(215,0,0,0.12); border: 1px solid rgba(215,0,0,0.3);
  color: #ff8888; padding: 6px 15px; border-radius: 50px;
  font-size: 11px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase;
  margin-bottom: 30px;
  animation: floatUp 0.75s var(--ease) both;
}
.hero-chip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.7); } }
.hero h1 {
  font-family: var(--serif); font-size: clamp(40px, 6vw, 82px);
  font-weight: 600; color: white; line-height: 1.08;
  letter-spacing: -1px; margin-bottom: 26px; max-width: 700px;
  animation: floatUp 0.75s 0.1s var(--ease) both;
}
.hero h1 em { font-style: italic; color: #ffaaaa; }
.hero-sub {
  font-size: clamp(15px, 1.6vw, 18px); color: rgba(255,255,255,0.6);
  line-height: 1.8; max-width: 500px; margin-bottom: 44px; font-weight: 300;
  animation: floatUp 0.75s 0.2s var(--ease) both;
}
.hero-btns {
  display: flex; gap: 12px; flex-wrap: wrap;
  animation: floatUp 0.75s 0.3s var(--ease) both;
}
.btn-red {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--red); color: white; border: none;
  padding: 15px 32px; border-radius: 50px;
  font-size: 15px; font-weight: 600;
  transition: all 0.25s var(--ease);
}
.btn-red:hover { background: var(--red-hover); transform: translateY(-2px); box-shadow: 0 8px 28px var(--red-glow); }
.btn-outline-w {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.08); color: white;
  border: 1.5px solid rgba(255,255,255,0.25);
  padding: 15px 32px; border-radius: 50px;
  font-size: 15px; font-weight: 500;
  backdrop-filter: blur(8px);
  transition: all 0.25s var(--ease);
}
.btn-outline-w:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.45); transform: translateY(-2px); }
/* Hero bottom cards */
.hero-bottom {
  position: relative; z-index: 3;
  max-width: 1200px; margin: 0 auto; padding: 0 32px 52px;
  width: 100%;
  animation: floatUp 0.75s 0.45s var(--ease) both;
}
.hero-status-card {
  display: inline-flex; align-items: center; gap: 14px;
  background: rgba(255,255,255,0.1); backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: var(--r-md); padding: 14px 20px; color: white;
}
.hero-status-dot { width: 9px; height: 9px; border-radius: 50%; background: #44ee88; box-shadow: 0 0 8px #44ee88; animation: blink 2s ease-in-out infinite; }
.hero-status-dot.closed { background: #ff4d4d; box-shadow: 0 0 10px rgba(255,77,77,0.8); }
.hero-status-text { font-size: 14px; font-weight: 600; }
.hero-status-sub { font-size: 11.5px; opacity: 0.55; margin-top: 2px; }
/* Edit hero btn */
.hero-edit {
  position: absolute; bottom: 26px; right: 32px; z-index: 4;
  background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.75);
  padding: 8px 16px; border-radius: 50px; font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  transition: all 0.2s;
}
.hero-edit:hover { background: rgba(255,255,255,0.18); color: white; }
@keyframes floatUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* ============================
   TRUST BAR
============================ */
.trust {
  background: white; border-bottom: 1px solid var(--gray-200);
}
.trust-scroll {
  max-width: 1200px; margin: 0 auto; padding: 0 32px;
  display: flex; overflow-x: auto; scrollbar-width: none;
}
.trust-scroll::-webkit-scrollbar { display: none; }
.trust-item {
  display: flex; align-items: center; gap: 12px;
  padding: 20px 30px; flex-shrink: 0;
  border-right: 1px solid var(--gray-200);
  transition: background 0.2s;
}
.trust-item:last-child { border-right: none; }
.trust-item:hover { background: var(--gray-100); }
.trust-ico { width: 40px; height: 40px; background: var(--gray-100); border-radius: 50%; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
.trust-lbl { font-size: 14px; font-weight: 700; color: var(--charcoal); }
.trust-sub { font-size: 12px; color: var(--gray-400); margin-top: 1px; }
.gold { color: #f5a623; letter-spacing: 1px; }

/* ============================
   SHARED SECTION STYLES
============================ */
section { padding: 96px 0; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: var(--red); margin-bottom: 14px; }
.title { font-family: var(--serif); font-size: clamp(28px, 3.8vw, 52px); font-weight: 600; color: var(--charcoal); line-height: 1.13; letter-spacing: -0.5px; }
.body-txt { font-size: clamp(15px, 1.3vw, 17px); color: var(--gray-500); line-height: 1.82; margin-top: 18px; font-weight: 300; }

/* ============================
   SCROLL REVEAL
============================ */
.sr { opacity: 0; transform: translateY(24px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
.sr.d1 { transition-delay: 0.08s; }
.sr.d2 { transition-delay: 0.16s; }
.sr.d3 { transition-delay: 0.24s; }
.sr.d4 { transition-delay: 0.32s; }
.sr.d5 { transition-delay: 0.40s; }
.sr.d6 { transition-delay: 0.48s; }
.sr.in { opacity: 1; transform: none; }

/* ============================
   ABOUT
============================ */
.about { background: var(--gray-100); }
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
/* Media block */
.about-media { position: relative; }
.about-media-frame {
  border-radius: var(--r-xl); overflow: hidden; aspect-ratio: 4/3;
  background: var(--gray-200); position: relative;
  box-shadow: var(--sh-xl); cursor: pointer;
}
.about-media-frame img, .about-media-frame video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s var(--ease); }
.about-media-frame:hover img, .about-media-frame:hover video { transform: scale(1.04); }
.about-media-placeholder {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; color: var(--gray-400);
}
.about-edit-btn {
  position: absolute; bottom: 14px; right: 14px;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
  border: none; border-radius: 50px; padding: 8px 16px;
  font-size: 12px; font-weight: 600; color: var(--charcoal);
  display: flex; align-items: center; gap: 6px;
  box-shadow: var(--sh-md); transition: all 0.2s; cursor: pointer;
}
.about-edit-btn:hover { background: white; box-shadow: var(--sh-lg); }
/* Badge */
.about-badge {
  position: absolute; top: -22px; right: -22px;
  background: var(--red); color: white; border-radius: 14px;
  padding: 20px 22px; text-align: center;
  box-shadow: 0 10px 32px rgba(215,0,0,0.3);
}
.about-badge-n { font-family: var(--serif); font-size: 40px; font-weight: 700; line-height: 1; }
.about-badge-t { font-size: 11px; font-weight: 600; opacity: 0.88; margin-top: 3px; }
/* Checks */
.about-checks { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 34px; }
.about-chk { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 500; color: var(--charcoal-2); }
.chk-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--red-dim); display: grid; place-items: center; flex-shrink: 0; }

/* ============================
   SERVICES
============================ */
.services { background: white; }
.svc-hd { display: grid; grid-template-columns: 1fr 1fr; gap: 52px; align-items: end; margin-bottom: 52px; }
/* Tabs */
.svc-tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--gray-200); margin-bottom: 40px; }
.svc-tab {
  background: none; border: none; border-bottom: 2.5px solid transparent;
  padding: 11px 22px; font-size: 14px; font-weight: 600; color: var(--gray-400);
  cursor: pointer; transition: all 0.2s; margin-bottom: -1.5px;
}
.svc-tab.active { color: var(--charcoal); border-bottom-color: var(--red); }
.svc-panel { display: none; }
.svc-panel.active { display: block; }
/* Cards */
.svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 18px; }
.svc-card {
  background: var(--gray-100); border-radius: var(--r-lg); padding: 28px;
  border: 1.5px solid transparent; position: relative; overflow: hidden;
  transition: all 0.3s var(--ease);
}
.svc-card-line {
  position: absolute; left: 0; top: 0; width: 3px; height: 0; background: var(--red);
  transition: height 0.35s var(--ease);
}
.svc-card:hover { border-color: rgba(215,0,0,0.12); box-shadow: var(--sh-lg); transform: translateY(-3px); }
.svc-card:hover .svc-card-line { height: 100%; }
.svc-ico { width: 44px; height: 44px; background: transparent; border-radius: 0; display: grid; place-items: center; font-size: 20px; margin-bottom: 14px; box-shadow: none; }
.svc-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; padding: 3px 10px; border-radius: 50px; background: var(--red-dim); color: var(--red); margin-bottom: 10px; }
.svc-name { font-size: 15.5px; font-weight: 700; color: var(--charcoal); margin-bottom: 4px; }
.svc-dur { font-size: 12px; color: var(--gray-400); font-weight: 500; margin-bottom: 14px; }
.svc-price { display: flex; align-items: baseline; gap: 3px; }
.svc-cur { font-size: 12px; color: var(--gray-400); }
.svc-amt { font-family: var(--serif); font-size: 26px; font-weight: 700; color: var(--charcoal); }
.svc-unit { font-size: 12px; color: var(--gray-400); }
.svc-desc { font-size: 13px; color: var(--gray-500); line-height: 1.8; margin-top: 12px; }
/* Dark card (coming soon) */
.svc-dark { background: var(--charcoal); }
.svc-dark .svc-name { color: white; }
.svc-dark .svc-desc { color: rgba(255,255,255,0.42); }
.svc-dark .svc-ico { background: transparent; }
.cs-tag { display: inline-block; background: rgba(215,0,0,0.2); color: #ff8888; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; padding: 3px 10px; border-radius: 50px; margin-bottom: 10px; }

/* ============================
   WHY CHOOSE US
============================ */
.why { background: var(--gray-100); }
.why-header { text-align: center; max-width: 540px; margin: 0 auto 60px; }
.why-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.why-card {
  background: white; border-radius: var(--r-lg); padding: 30px 22px;
  text-align: center; border: 1.5px solid transparent;
  transition: all 0.3s var(--ease);
}
.why-card:hover { border-color: rgba(215,0,0,0.1); box-shadow: var(--sh-lg); transform: translateY(-5px); }
.why-ico-wrap {
  width: 56px; height: 56px; background: var(--red-dim); border-radius: 16px;
  display: grid; place-items: center; margin: 0 auto 18px; font-size: 24px;
  transition: background 0.3s var(--ease), transform 0.3s var(--ease-spring);
}
.why-card:hover .why-ico-wrap { background: var(--red); transform: scale(1.1) rotate(-4deg); }
.why-card h4 { font-size: 15px; font-weight: 700; color: var(--charcoal); margin-bottom: 8px; }
.why-card p { font-size: 13px; color: var(--gray-500); line-height: 1.65; }

/* ============================
   GALLERY
============================ */
.gallery { background: var(--charcoal); padding: 80px 0; }
.gallery .eyebrow { color: #ff9999; }
.gallery .title { color: white; }
.gallery-hd { margin-bottom: 36px; }
.gallery-grid {
  display: grid;
  grid-template-columns: 2.2fr 1fr 1fr;
  grid-template-rows: 218px 218px;
  gap: 12px;
}
.gal-item {
  border-radius: var(--r-sm); overflow: hidden; position: relative;
  background: var(--charcoal-3); cursor: pointer;
}
.gal-item:first-child { grid-row: 1 / 3; }
.gal-item img, .gal-item video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.55s var(--ease); }
